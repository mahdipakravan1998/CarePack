name: Android verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Git whitespace contracts
        run: git diff --check

      - name: Verify permanent supply-chain state
        shell: pwsh
        run: |
          & ./tools/verify-supply-chain.ps1 -Repo "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require explicit review for supply-chain file changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          $sensitive = @(
            "gradle/verification-metadata.xml",
            "app/gradle.lockfile",
            "settings-gradle.lockfile",
            "gradle/wrapper/gradle-wrapper.jar",
            "gradle/wrapper/gradle-wrapper.properties"
          )

          $changed = @(
            git diff --name-only $env:BASE_SHA $env:HEAD_SHA -- $sensitive
          )

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect supply-chain changes."
          }

          if ($changed.Count -gt 0) {
            Write-Host "Supply-chain files changed:"
            $changed | ForEach-Object { Write-Host " - $_" }

            $labels =
              @(
                ($env:PR_LABELS -split ",") |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ }
              )

            if ($labels -notcontains "supply-chain-reviewed") {
              throw (
                "Supply-chain artifacts changed. " +
                "A reviewer must apply the 'supply-chain-reviewed' PR label."
              )
            }
          }

      - name: Verify clean source contracts and Room baseline
        shell: pwsh
        run: |
          & ./gradlew `
            --no-daemon `
            --no-configuration-cache `
            --dependency-verification strict `
            verifyForbiddenWording `
            verifyPackageBoundaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./tools/verify-room-schema.ps1 -Repo "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile, unit test, lint and debug build
        run: |
          ./gradlew --no-daemon --no-configuration-cache --dependency-verification strict \
            compileDebugKotlin \
            compileDebugUnitTestKotlin \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            compileDebugAndroidTestKotlin \
            assembleDebugAndroidTest

      - name: Summarize unit test results
        if: always()
        shell: pwsh
        run: tools/summarize-tests.ps1 -Root app/build/test-results/testDebugUnitTest

      - name: Upload debug verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-verification-reports
          if-no-files-found: error
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
            build/test-summary.json

  reproducibility:
    name: Fresh wrapper build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Configure dedicated Gradle home
        shell: pwsh
        env:
          CAREPACK_GRADLE_HOME: ${{ runner.temp }}/carepack-gradle-fresh
        run: |
          "GRADLE_USER_HOME=$env:CAREPACK_GRADLE_HOME" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Checkout fresh repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reset dedicated Gradle home
        shell: pwsh
        run: |
          Remove-Item `
            -LiteralPath $env:GRADLE_USER_HOME `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
          New-Item `
            -ItemType Directory `
            -Path $env:GRADLE_USER_HOME `
            -Force |
            Out-Null

      - name: Verify wrapper repository contract and version
        shell: pwsh
        run: |
          $required = @(
            "gradlew",
            "gradlew.bat",
            "gradle/wrapper/gradle-wrapper.jar",
            "gradle/wrapper/gradle-wrapper.properties"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing wrapper component: $path"
            }

            $tracked = @(git ls-files -- $path)
            if ($LASTEXITCODE -ne 0 -or $tracked.Count -ne 1) {
              throw "Wrapper component is not tracked exactly once: $path"
            }
          }

          $mode = @(git ls-files --stage -- gradlew)
          if (
            $LASTEXITCODE -ne 0 -or
            $mode.Count -ne 1 -or
            -not ([string]$mode[0]).StartsWith("100755 ")
          ) {
            throw "gradlew is not tracked with executable mode 100755."
          }

          if ($env:RUNNER_OS -ne "Windows") {
            & bash -c "test -x ./gradlew"
            if ($LASTEXITCODE -ne 0) {
              throw "./gradlew is not executable on the Unix checkout."
            }
          }

          $wrapper =
            if ($env:RUNNER_OS -eq "Windows") {
              ".\gradlew.bat"
            } else {
              "./gradlew"
            }

          & $wrapper --version
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle wrapper version check failed."
          }

      - name: Strict fresh-cache debug build
        shell: pwsh
        run: |
          $wrapper =
            if ($env:RUNNER_OS -eq "Windows") {
              ".\gradlew.bat"
            } else {
              "./gradlew"
            }

          & $wrapper `
            --no-daemon `
            --no-configuration-cache `
            --dependency-verification strict `
            clean `
            assembleDebug

          if ($LASTEXITCODE -ne 0) {
            throw "Fresh-cache strict debug build failed."
          }

      - name: Compare default and empty-mavenLocal dependency graphs
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $evidenceRoot = "build/reproducibility-evidence"
          New-Item `
            -ItemType Directory `
            -Path $evidenceRoot `
            -Force |
            Out-Null

          $emptyMavenLocal =
            Join-Path $env:RUNNER_TEMP "carepack-empty-m2"

          Remove-Item `
            -LiteralPath $emptyMavenLocal `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $emptyMavenLocal `
            -Force |
            Out-Null

          $defaultReport =
            Join-Path $evidenceRoot "debugRuntimeClasspath-default.txt"

          $localReport =
            Join-Path $evidenceRoot "debugRuntimeClasspath-empty-mavenLocal.txt"

          & ./gradlew `
            -q `
            --no-daemon `
            --no-configuration-cache `
            --dependency-verification strict `
            :app:dependencies `
            --configuration debugRuntimeClasspath |
            Set-Content -LiteralPath $defaultReport -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            throw "Default dependency graph generation failed."
          }

          & ./gradlew `
            -q `
            --no-daemon `
            --no-configuration-cache `
            --dependency-verification strict `
            "-Dmaven.repo.local=$emptyMavenLocal" `
            -PcarepackUseMavenLocal=true `
            :app:dependencies `
            --configuration debugRuntimeClasspath |
            Set-Content -LiteralPath $localReport -Encoding UTF8

          if ($LASTEXITCODE -ne 0) {
            throw "Empty-mavenLocal dependency graph generation failed."
          }

          $difference =
            @(
              Compare-Object `
                -ReferenceObject (Get-Content -LiteralPath $defaultReport) `
                -DifferenceObject (Get-Content -LiteralPath $localReport)
            )

          if ($difference.Count -gt 0) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Dependency graph changed when empty mavenLocal was explicitly enabled."
          }

          Write-Host "Dependency graph parity: PASS"

      - name: Upload reproducibility evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-evidence
          if-no-files-found: error
          path: build/reproducibility-evidence/

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/run-ci-instrumentation.sh

      - name: Summarize instrumentation results
        if: always()
        shell: pwsh
        run: tools/summarize-tests.ps1 -Root app/build/outputs/androidTest-results

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-evidence
          if-no-files-found: error
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
            build/test-summary.json
            build/performance-evidence/

  release:
    if: github.ref == 'refs/heads/main'
    needs:
      - verify
      - reproducibility
      - instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:

      CAREPACK_KEYSTORE_PASSWORD: ${{ secrets.CAREPACK_KEYSTORE_PASSWORD }}
      CAREPACK_KEY_ALIAS: ${{ secrets.CAREPACK_KEY_ALIAS }}
      CAREPACK_KEY_PASSWORD: ${{ secrets.CAREPACK_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate dependency report and online release dependency audit
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path "build/release-inspection" `
            -Force |
            Out-Null

          & ./gradlew `
            -q `
            --no-daemon `
            --no-configuration-cache `
            --dependency-verification strict `
            :app:dependencies |
            Tee-Object `
              -FilePath "build/release-inspection/dependencies.txt"

          if ($LASTEXITCODE -ne 0) {
            throw "Release dependency report generation failed."
          }

          & ./tools/audit-release-dependencies.ps1 `
            -OutputRoot "build/release-inspection"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify tracked-only source archive
        shell: pwsh
        run: |
          $archive =
            "build/release-inspection/carepack-source.zip"

          & git archive `
            --format=zip `
            -o $archive `
            HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "git archive HEAD failed."
          }

          & ./tools/verify-artifact-hygiene.ps1 -Root $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-FileHash `
            -Algorithm SHA256 `
            -LiteralPath $archive |
            Format-List |
            Out-File `
              "build/release-inspection/source-archive-sha256.txt"

      - name: Restore signing material outside workspace
        shell: bash
        env:
          CAREPACK_KEYSTORE_PATH: ${{ runner.temp }}/carepack-release.jks
        run: |
          printf 'CAREPACK_KEYSTORE_PATH=%s\n' "$CAREPACK_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' '${{ secrets.CAREPACK_KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > "$CAREPACK_KEYSTORE_PATH"
          chmod 600 "$CAREPACK_KEYSTORE_PATH"

      - name: Build minified release APK and AAB
        run: |
          ./gradlew --no-daemon --no-configuration-cache --dependency-verification strict \
            assembleRelease \
            bundleRelease

      - name: Verify release artifacts, merged manifest and source hygiene
        shell: pwsh
        run: |
          & ./tools/verify-artifact-hygiene.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./tools/verify-merged-manifest.ps1 `
            -Manifest app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./tools/inspect-release.ps1 `
            -Apk app/build/outputs/apk/release/app-release.apk `
            -Aab app/build/outputs/bundle/release/app-release.aab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Minified release startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            pwsh -File tools/smoke-release.ps1 -Apk app/build/outputs/apk/release/app-release.apk

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
            build/release-inspection/
